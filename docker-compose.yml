services:
  keycloack:
    image: quay.io/keycloak/keycloak:26.7.4
    container_name: keycloak
    ports: 
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    command: ["start-dev"]
    volumes:
      - keycloak_data:/opt/keycloak/data
    user: root #development only
volumes:
  keycloak_data: